services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: atrio-api-dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://atrio:atrio_dev_pass@pgbouncer:5432/atrio_erp?schema=public&pgbouncer=true
      MIGRATE_DATABASE_URL: postgresql://atrio:atrio_dev_pass@postgres:5432/atrio_erp?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: atrio-web-dev
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/dist
      - /app/.vite
    restart: unless-stopped
    depends_on:
      - api
