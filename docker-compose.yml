services:
  postgres:
    image: postgres:16-alpine
    container_name: atrio-postgres
    environment:
      POSTGRES_DB: atrio_erp
      POSTGRES_USER: atrio
      POSTGRES_PASSWORD: atrio_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atrio -d atrio_erp']
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: atrio-pgbouncer
    environment:
      DB_USER: atrio
      DB_PASSWORD: atrio_dev_pass
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: atrio_erp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - '6432:5432'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: atrio-redis
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: atrio-minio
    command: server /data --console-address ":9001"
    expose:
      - '9000'
      - '9001'
    environment:
      MINIO_ROOT_USER: atrio_reportes
      MINIO_ROOT_PASSWORD: minio_dev_pass
      MINIO_BUCKET: atrio-reportes
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
